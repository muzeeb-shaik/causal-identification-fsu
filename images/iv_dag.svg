<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="Open Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#990000"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <!-- Unobserved confounder -->
  <ellipse cx="660" cy="85" rx="190" ry="58" fill="#ffffff" stroke="#555" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="660" y="78" text-anchor="middle" font-size="27" font-weight="700" fill="#222">U  Unobserved</text>
  <text x="660" y="110" text-anchor="middle" font-size="21" fill="#444">common shock</text>

  <!-- Nodes -->
  <rect x="30" y="245" width="270" height="105" rx="12" fill="#f7eeee" stroke="#990000" stroke-width="2.5"/>
  <text x="165" y="287" text-anchor="middle" font-size="27" font-weight="700" fill="#222">Z  Instrument</text>
  <text x="165" y="320" text-anchor="middle" font-size="19" fill="#444">2nd-degree peers' traits</text>

  <rect x="415" y="245" width="270" height="105" rx="12" fill="#f7eeee" stroke="#990000" stroke-width="2.5"/>
  <text x="550" y="287" text-anchor="middle" font-size="27" font-weight="700" fill="#222">D  Treatment</text>
  <text x="550" y="320" text-anchor="middle" font-size="19" fill="#444">share of peers disclosing</text>

  <rect x="800" y="245" width="270" height="105" rx="12" fill="#f7eeee" stroke="#990000" stroke-width="2.5"/>
  <text x="935" y="287" text-anchor="middle" font-size="27" font-weight="700" fill="#222">Y  Outcome</text>
  <text x="935" y="320" text-anchor="middle" font-size="19" fill="#444">firm discloses</text>

  <!-- Causal arrows -->
  <line x1="300" y1="297" x2="410" y2="297" stroke="#990000" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="685" y1="297" x2="795" y2="297" stroke="#990000" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="610" y1="140" x2="568" y2="240" stroke="#990000" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="735" y1="137" x2="880" y2="240" stroke="#990000" stroke-width="4" marker-end="url(#arr)"/>

  <!-- Relevance label -->
  <text x="355" y="282" text-anchor="middle" font-size="18" fill="#990000" font-weight="700">relevance</text>

  <!-- Exclusion: no direct Z to Y path -->
  <path d="M165,352 C165,450 935,450 935,355" fill="none" stroke="#9a9a9a" stroke-width="3" stroke-dasharray="10 7"/>
  <line x1="530" y1="408" x2="570" y2="448" stroke="#990000" stroke-width="5"/>
  <line x1="570" y1="408" x2="530" y2="448" stroke="#990000" stroke-width="5"/>
  <text x="550" y="400" text-anchor="middle" font-size="19" fill="#555">exclusion: no direct path from Z to Y</text>

  <!-- Independence: no U to Z link -->
  <path d="M470,95 C300,95 190,150 170,240" fill="none" stroke="#9a9a9a" stroke-width="3" stroke-dasharray="10 7"/>
  <line x1="236" y1="112" x2="270" y2="146" stroke="#990000" stroke-width="5"/>
  <line x1="270" y1="112" x2="236" y2="146" stroke="#990000" stroke-width="5"/>
  <text x="130" y="95" text-anchor="middle" font-size="19" fill="#555">independence:</text>
  <text x="130" y="119" text-anchor="middle" font-size="19" fill="#555">Z unrelated to U</text>
</svg>
